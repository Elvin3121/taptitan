workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2 # Uses your 500 free monthly minutes
    scripts:
      - name: Clean and Install Dependencies
        script: | 
          cd template
          # Force delete old modules to prevent "module not found" errors
          rm -rf node_modules
          npm install --no-audit --no-fund
      - name: Build Release APK
        script: |
          cd template/android
          chmod +x gradlew
          # Added the timeout fix (-Dorg.gradle.internal.http.socketTimeout=600000)
          # 'assembleRelease' creates the assets folder and the bundle
          ./gradlew assembleRelease -Dorg.gradle.internal.http.socketTimeout=600000
    artifacts:
      - template/android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com # CHANGE THIS to your email to skip paywalls!
          
      
scripts:
  - |
    cd template && npm install
    cd template/android && chmod +x gradlew && ./gradlew assembleDebug
    
